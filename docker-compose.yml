services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ai_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: ai_assistant
      DB_PORT: 5432
      JWT_SECRET: supersecretkey
      MONGO_URI: mongodb://mongo:27017/ai_assistant
    depends_on:
      - postgres
      - mongo
    command: [ "npm", "run", "dev" ]

  mongo:
    image: mongo:6
    container_name: ai_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
