services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:6
    container_name: ai_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ai_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: ./backend
    container_name: ai_backend
    restart: always
    environment:
      PORT: 5001
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: ai_assistant
      DB_PORT: 5432
      JWT_SECRET: supersecretkey
      MONGO_URI: mongodb://mongo:27017/ai_assistant
      RABBITMQ_URL: amqp://rabbitmq
      CHROMA_URL: http://chroma:8000
      OPENAI_API_KEY: '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'
      GEMINI_API_KEY: 'AIzaSyC5AL_VtFS-LvB1I_WyW4zdSMe6luD6XaQ'
    depends_on:
      - postgres
      - mongo
      - rabbitmq

  frontend:
    container_name: ai_frontend
    restart: always
    depends_on:
      - backend

  worker:
    build: ./worker
    container_name: ai_worker
    restart: always
    depends_on:
      - rabbitmq
      - mongo
      - postgres
      - chroma
    environment:
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: ai_assistant
      DB_PORT: 5432
      MONGO_URI: mongodb://mongo:27017/ai_assistant
      RABBITMQ_URL: amqp://rabbitmq
      CHROMA_URL: http://chroma:8000
      OPENAI_API_KEY: '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'
      GEMINI_API_KEY: 'AIzaSyC5AL_VtFS-LvB1I_WyW4zdSMe6luD6XaQ'

  chroma:
    image: chromadb/chroma:1.4.1
    container_name: ai_chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/.chroma/index

volumes:
  postgres_data:
  mongo_data:
  chroma_data:
