<div class="app-container">
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-icon">🤖</span>
            <span class="logo-text">AI Assistant</span>
        </div>
        
        <nav class="nav-menu">
            <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
                <span class="icon">📊</span> Dashboard
            </a>
            <a routerLink="/documents" routerLinkActive="active" class="nav-item">
                <span class="icon">📁</span> Documents
            </a>
            <a routerLink="/chat" routerLinkActive="active" class="nav-item">
                <span class="icon">💬</span> Chat
            </a>
            @if (authGuard.isAdmin()) {
                <div class="nav-divider"></div>
                <div class="nav-label">Admin</div>
                <a routerLink="/admin" routerLinkActive="active" class="nav-item">
                    <span class="icon">🛡️</span> Admin Panel
                </a>
            }
        </nav>

        <div class="sidebar-footer">
            <button (click)="logout()" class="logout-btn">
                <span class="icon">↪️</span> Logout
            </button>
        </div>
    </aside>

    <main class="content-area">
        <router-outlet></router-outlet>
    </main>
</div>
