<div class="auth-page">
    <div class="auth-card">
        <header class="auth-header">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📝</div>
            <h2>Create Account</h2>
            <p>Join us to start building your knowledge base.</p>
        </header>

        <div *ngIf="message()" class="status-msg success">
            {{ message() }}
        </div>

        <div *ngIf="error()" class="status-msg error">
            {{ error() }}
        </div>

        <form (submit)="$event.preventDefault(); onRegister()" class="form-group">
            <div class="input-container">
                <label>Full Name</label>
                <input type="text" [(ngModel)]="name" name="name" placeholder="John Doe" class="input-field" required>
            </div>

            <div class="input-container">
                <label>Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" placeholder="name@company.com" class="input-field" required>
            </div>

            <div class="input-container">
                <label>Password</label>
                <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" class="input-field" required>
            </div>

            <button type="submit" class="auth-btn" [disabled]="!email || !password || !name">
                Register
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a routerLink="/login">Sign In</a>
        </div>
    </div>
</div>
