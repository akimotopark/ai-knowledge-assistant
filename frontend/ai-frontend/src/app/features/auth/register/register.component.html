<div class="auth-card">
    <h2>Create Account</h2>

    <div *ngIf="message()" style="color: green; padding: 10px; background: #e6fffa; border: 1px solid green;">
        {{ message() }}
    </div>

    <div *ngIf="error()" style="color: red; padding: 10px; background: #fff5f5; border: 1px solid red;">
        {{ error() }}
    </div>

    <div class="form-group">
        <input type="text" [(ngModel)]="name" placeholder="Full Name">
    </div>

    <div class="form-group">
        <input type="email" [(ngModel)]="email" placeholder="Email Address">
    </div>

    <div class="form-group">
        <input type="password" [(ngModel)]="password" placeholder="Password">
    </div>

    <button (click)="onRegister()" [disabled]="!email || !password">
        Register
    </button>

    <p>
        Already have an account?
        <a routerLink="/login">Login here</a>
    </p>
</div>
