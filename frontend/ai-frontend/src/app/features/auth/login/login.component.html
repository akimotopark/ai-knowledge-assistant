<div class="auth-page">
    <div class="auth-card">
        <header class="auth-header">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🤖</div>
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access your assistant.</p>
        </header>

        <form (submit)="onLogin()" class="form-group">
            <div class="input-container">
                <label>Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" placeholder="name@company.com" class="input-field" required>
            </div>

            <div class="input-container">
                <label>Password</label>
                <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" class="input-field" required>
            </div>

            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a routerLink="/register">Create one</a>
        </div>
    </div>
</div>
