<div class="upload-container">
    <h2>Upload Document</h2>

    <div *ngIf="message()" class="message-banner" [class.error]="message().includes('failed')">
        {{ message() }}
    </div>

    <div class="form-group">
        <label for="doc-title">Title</label>
        <input id="doc-title" type="text" [ngModel]="title()" (ngModelChange)="title.set($event)" name="title" placeholder="Document Title">
    </div>

    <div class="form-group">
        <label for="doc-desc">Description</label>
        <textarea id="doc-desc" [ngModel]="description()" (ngModelChange)="description.set($event)" name="description" placeholder="Enter description..."></textarea>
    </div>

    <div class="form-group">
        <label for="doc-file">Select File</label>
        <input id="doc-file" type="file" (change)="onFileSelected($event)" name="file">
    </div>

    <button class="upload-btn" (click)="upload()" [disabled]="loading()">
        {{ loading() ? 'Uploading...' : 'Upload Now' }}
    </button>
</div>
