apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
  namespace: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      containers:
      - name: chroma
        image: chromadb/chroma
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: chroma-data
          mountPath: /chroma/.chroma/index
      volumes:
      - name: chroma-data
        emptyDir: {} # For persistence use PVC in production
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: ai-assistant
spec:
  selector:
    app: chroma
  ports:
  - port: 8000
    targetPort: 8000
