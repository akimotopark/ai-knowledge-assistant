apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: ai-worker:latest # Replace with actual image path
        env:
        - name: DB_HOST
          value: "postgres.ai-assistant.svc.cluster.local"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-assistant-secrets
              key: postgres-password
        - name: DB_NAME
          value: "ai_assistant"
        - name: DB_PORT
          value: "5432"
        - name: MONGO_URI
          value: "mongodb://mongodb.ai-assistant.svc.cluster.local:27017/ai_assistant"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq.ai-assistant.svc.cluster.local"
        - name: CHROMA_URL
          value: "http://chroma.ai-assistant.svc.cluster.local:8000"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-assistant-secrets
              key: openai-api-key
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-assistant-secrets
              key: gemini-api-key
